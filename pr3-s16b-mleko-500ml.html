<h1>Naleśniki na mleku, wersja B</h1>
<p>Autor: Test Testowy</p>
<p>Czas przygotowania: 15 minut.</p>
<p>Liczba porcji: 2</p>

<h2>Składniki</h2>
<ul>
  <li>500 ml mleka</li>
  <li>150 g mąki pszennej</li>
  <li>2 szt jajka kurze</li>
</ul>

<h2>Sposób przygotowania</h2>
<ol>
  <li>Wymieszaj mąkę z mlekiem i jajkami, usmaż naleśniki.</li>
</ol>
